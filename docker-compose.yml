# ============================================================
# ARGUS — AI Trading Fund (self-hosted)
# اجرا:   docker compose up -d --build
# بازکردن: http://localhost:3000
# توقف:   docker compose down
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: argus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus_secret_change_me
      POSTGRES_DB: argus
    volumes:
      - argus-pgdata:/var/lib/postgresql/data
      # ساخت خودکار همه جداول در اولین بوت
      - ./drizzle/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: argus-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://argus:argus_secret_change_me@db:5432/argus
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s

volumes:
  argus-pgdata:
